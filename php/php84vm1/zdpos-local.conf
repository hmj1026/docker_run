; vm1 canary 規格（zdpos-local pool）；本機差異：listen 改 0.0.0.0:9000
[zdpos-local]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 25M
php_admin_value[date.timezone] = Asia/Taipei
php_admin_value[error_log] = /var/log/php/php_errors.log
php_admin_value[session.save_path] = /var/lib/php/sessions-zdpos
php_admin_value[soap.wsdl_cache_dir] = /var/lib/php/wsdlcache-zdpos
php_admin_value[cgi.fix_pathinfo] = 0

php_admin_flag[log_errors] = on
php_admin_flag[short_open_tag] = off
php_admin_flag[expose_php] = off
php_admin_flag[session.cookie_httponly] = on

env[APP_ENV] = staging
