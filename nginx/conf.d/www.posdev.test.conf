# ================================================
# POS Nginx VHost Configuration
# 支援多入口 (dev3, dev4...dev99) 與 HTTPS
# ================================================

# HTTP 轉 HTTPS
server {
    listen 80;
    server_name www.posdev.test;

    # 強制跳轉到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name www.posdev.test;

    # 文件根目錄
    root /var/www/www.posdev;
    index index.php index.html;

    # 字元編碼
    charset utf-8;

    # ================================================
    # SSL 憑證配置
    # ================================================
    ssl_certificate /etc/nginx/ssl/laragon.crt;
    ssl_certificate_key /etc/nginx/ssl/laragon.key;

    # SSL 協議與加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ================================================
    # 日誌配置
    # ================================================
    access_log /var/log/nginx/pos_dev-access.log;
    error_log /var/log/nginx/pos_dev-error.log warn;

    # ================================================
    # 安全限制
    # ================================================
    # 禁止訪問隱藏檔案
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止訪問受保護目錄
    location ~ ^/(protected|yii_framework) {
        deny all;
    }

    # 禁止訪問敏感檔案
    location ~ \.(env|git|gitignore|htaccess|sql|bak)$ {
        deny all;
    }

    # ================================================
    # 靜態資源處理（優先級最高）
    # ================================================
    # 常見靜態檔案：圖片、字型、CSS、JS 等
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf|webp|bmp|tiff)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 根目錄常見檔案（favicon.ico, robots.txt 等）
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml|humans\.txt|ads\.txt)$ {
        access_log off;
        try_files $uri =404;
    }

    # ================================================
    # PHP-FPM 處理
    # ================================================
    # PHP 檔案處理（所有 .php 檔案）
    location ~ \.php$ {
        # 安全檢查：防止路徑穿越攻擊
        try_files $uri =404;

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI 設定
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # 隱藏 PHP 版本資訊
        fastcgi_hide_header X-Powered-By;
    }

    # ================================================
    # 通用路由處理（包含根目錄與子目錄）
    # ================================================
    # 處理所有路徑，確保深層路由正確轉發到對應的 index.php
    # 範例：
    #   / → /index.php (根目錄)
    #   /dev3/ → /dev3/index.php (子目錄首頁)
    #   /dev3/user/edit → /dev3/index.php (子目錄深層路由)
    location / {
        # 優先順序：
        # 1. 精確檔案匹配（$uri）- 靜態檔案、已存在的 PHP 檔案
        # 2. 目錄匹配（$uri/）- 目錄存在則尋找 index
        # 3. 子目錄 fallback (@subdir_router) - 不存在則轉發到對應 index.php
        try_files $uri $uri/ @subdir_router;
    }

    # ================================================
    # 子目錄路由處理器（named location）
    # ================================================
    # 當檔案/目錄不存在時，提取第一層路徑並轉發到對應的 index.php
    # 範例：
    #   /dev3/user/edit → /dev3/index.php
    #   /dev3 → /dev3/index.php
    #   /notexist → /notexist/index.php (然後 404)
    location @subdir_router {
        # 使用 rewrite 提取第一層路徑（區分是否有後續路徑）
        rewrite ^/([^/]+)(/.*)?$ /$1/index.php last;
    }

    # ================================================
    # 效能優化
    # ================================================
    # Gzip 壓縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Client Body 大小限制
    client_max_body_size 100M;
    client_body_buffer_size 128k;
}
