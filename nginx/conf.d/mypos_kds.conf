# ================================================
# MyPOS KDS Nginx VHost Configuration
# Laravel 專案 - 廚房顯示系統
# ================================================
# URL 格式: https://mypos.posdev.test/public/link/kds/{dbName}

server {
    listen 443 ssl http2;
    server_name mypos.posdev.test;

    # 根目錄設為專案根目錄（包含 public 子目錄）
    root /var/www/www.posdev/mypos_kds;
    index index.php index.html;

    charset utf-8;

    # ================================================
    # SSL 憑證配置
    # ================================================
    ssl_certificate /etc/nginx/ssl/laragon.crt;
    ssl_certificate_key /etc/nginx/ssl/laragon.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ================================================
    # 日誌配置
    # ================================================
    access_log /var/log/nginx/mypos_kds-access.log;
    error_log /var/log/nginx/mypos_kds-error.log warn;

    # ================================================
    # 安全限制 - 禁止訪問敏感目錄和檔案
    # ================================================
    location ~ /\. {
        deny all;
    }

    location ~ ^/(vendor|app|config|database|routes|resources|domain|Infrastructure|bootstrap|storage)/ {
        deny all;
    }

    # ================================================
    # /public 靜態資源
    # ================================================
    location ~* ^/public/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf|webp|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ================================================
    # /public/index.php - Laravel 入口
    # ================================================
    location = /public/index.php {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/www.posdev/mypos_kds/public/index.php;
        include fastcgi_params;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # ================================================
    # /public/* - 所有 /public 開頭的請求
    # ================================================
    location ^~ /public/ {
        # 嘗試找靜態檔案，找不到則轉發到 Laravel
        try_files $uri $uri/ /public/index.php?$query_string;
    }

    # ================================================
    # 根路徑重定向到 /public/
    # ================================================
    location = / {
        return 301 /public/;
    }

    # ================================================
    # 效能優化
    # ================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    client_max_body_size 100M;
}

# HTTP 轉 HTTPS
server {
    listen 80;
    server_name mypos.posdev.test;
    return 301 https://$server_name$request_uri;
}
